[package]
name = "collections-embedded"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
collections = { package = "collections-traits", path = "../..", default-features = false, features = ["heapless"] }
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
cortex-m-semihosting = "0.6.0"
panic-semihosting = { version = "0.7.0", features = ["exit"] }
embedded-alloc = { version = "0.7.0", optional = true }
hashbrown = { version = "0.17.1", default-features = false, optional = true }

[features]
heap = ["dep:embedded-alloc", "dep:hashbrown", "collections/alloc", "collections/hashbrown"]

[[bin]]
name = "noheap"

[[bin]]
name = "heap"
required-features = ["heap"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
