name: Lints

on:
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Format
        run: cargo +nightly fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy with all features
        run: cargo clippy --workspace --locked --all-features --all-targets -- -D warnings
      - name: Clippy without default features
        run: cargo clippy --workspace --locked --no-default-features --all-targets -- -D warnings
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-docs
      - name: Build docs.rs configuration
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo +nightly doc --workspace --locked --all-features --no-deps
