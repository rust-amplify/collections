[package]
name = "collections"
version = "0.1.0"
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
description = "The missed collection traits"
repository = "https://github.com/rust-amplify/collections"
homepage = "https://docs.rs/collections"
keywords = ["generics", "core", "collections", "patterns"]
categories = ["data-structures", "rust-patterns", "no-std"]
readme = "README.md"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.100.0" # Due to allocator-aware collection support
exclude = [".github"]

[lib]
name = "collections"

[dependencies]
ascii = { version = "1.1.0", default-features = false, optional = true }
indexmap = { version = "2.14.2", default-features = false, optional = true } # The lock file pins this version for MSRV.
allocator-api2 = { version = "0.4.0", default-features = false, features = ["alloc"], optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "allocator-api2"], optional = true }

[features]
default = ["std"]
all = ["std", "ascii", "indexmap", "hashbrown"]

std = ["ascii?/std", "indexmap?/std"]

ascii = ["dep:ascii", "ascii/alloc"]
indexmap = ["dep:indexmap"]
hashbrown = ["dep:allocator-api2", "dep:hashbrown"]

[package.metadata.docs.rs]
features = ["all"]
