[package]
name = "collections"
version = "0.1.0"
authors = ["Dr Maxim Orlovsky <orlovsky@ubideco.org>"]
description = "The missed collection traits"
repository = "https://github.com/rust-collections/collections"
homepage = "https://docs.rs/collections"
keywords = ["generics", "core", "collections", "patterns"]
categories = ["data-structures", "rust-patterns", "no-std"]
readme = "README.md"
license = "Apache-2.0"
edition = "2021" # TODO: Update the edition in version 1.0
rust-version = "1.75.0"
exclude = [".github"]

[lib]
name = "collections"

[dependencies]
ascii = { version = "1.1.0", optional = true }
indexmap = { version = "2.11.4", optional = true } # NB: Do not upgrade, this will break MSRV!

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"

[features]
default = ["std"]
all = ["std", "ascii", "indexmap"]

std = ["ascii?/std", "indexmap?/std"]

ascii = ["dep:ascii"]
indexmap = ["dep:indexmap"]

[package.metadata.docs.rs]
features = ["all"]
